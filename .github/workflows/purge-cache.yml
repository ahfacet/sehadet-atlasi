name: Purge Cloudflare cache
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            s=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '.status + " " + .commit')
            [ "$s" = "built ${{ github.sha }}" ] && exit 0
            [ "${s%% *}" = "errored" ] && exit 1
            sleep 10
          done
          exit 1
      - name: Purge cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          r=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}')
          echo "$r" | grep -q '"success":true' || { echo "$r"; exit 1; }
